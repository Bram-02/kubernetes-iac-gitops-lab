apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website-prod
resources:
  - ../../base
labels:
  - pairs:
      lingkungan: prod
    includeTemplates: true
images:
  - name: ghcr.io/bram-02/devops-website-bram
    newTag: 5fcf1ed4c93ffee8ffa9ac8c1a1527eb95267ad3
replicas:
  - name: website
    count: 3
patches:
  - target:
      kind: Deployment
      name: website
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
