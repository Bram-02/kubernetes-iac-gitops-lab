# Rahasia Katalog dari Git: Argo CD hanya menerapkan ciphertext,
# controller Sealed Secrets di cluster yang membukanya menjadi Secret.
# Sengaja tanpa finalizer resources-finalizer: menghapus Application ini
# tidak ikut menghapus SealedSecret beserta password database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: katalog-secrets
  namespace: argocd
spec:
  project: katalog
  source:
    repoURL: https://github.com/Bram-02/kubernetes-iac-gitops-lab.git
    targetRevision: main
    path: week14/secrets
    directory:
      include: "*.sealedsecret.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: umkm-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
