apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Bram-02/latihan-devops.git
    targetRevision: main
    path: week11/kustomize/website/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: website-prod
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: website
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.37
